name: Deploy site to GitHub Pages

# Publishes ONLY index.html. The rest of the repo (specs, .docx deliverables,
# mock ticket data, source diagrams) stays in the repo but is not served.
#
# Prerequisite: Settings -> Pages -> Source must be set to "GitHub Actions".
# The enablement:true below tries to do that automatically on first run, but it
# can 403 depending on token permissions — if the build fails with
# "Get Pages site failed ... Not Found", set it in the UI and re-run.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'site/**'            # template or build script changed
      - 'architecture/**'    # a diagram was added or replaced
      - '.github/workflows/deploy.yml'
  workflow_dispatch:        # lets you trigger a deploy manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; don't cancel one that's mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Rebuild index.html from the template and diagrams
        # Deliberately rebuilt here rather than trusting the committed index.html —
        # otherwise adding a diagram to architecture/ silently does nothing until
        # someone remembers to run the build locally.
        run: python3 site/build_site.py

      - name: Stage the site
        run: |
          mkdir -p _site/architecture
          cp index.html _site/index.html
          # diagram images only — no specs, .docx or mock data get published
          cp architecture/*.png _site/architecture/ 2>/dev/null || true
          cp architecture/*.svg _site/architecture/ 2>/dev/null || true
          # stops Pages running the output through Jekyll
          touch _site/.nojekyll
          echo "index.html   $(du -h _site/index.html | cut -f1)"
          echo "diagrams     $(du -sh _site/architecture | cut -f1)"

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          # creates the Pages site on first run instead of failing with
          # "Get Pages site failed ... Not Found"
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
